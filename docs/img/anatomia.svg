<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hexágono, vértice y arista en el tablero de Catan</title>
<desc>Tres hexágonos se juntan en un vértice. Los pips de ese vértice son la suma de los pips de los tres hexágonos que toca.</desc>
<rect x="0" y="0" width="680" height="370" fill="#FAF7F0"/>

<polygon points="200,60 260.6,95 260.6,165 200,200 139.4,165 139.4,95" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<polygon points="321,60 381.6,95 381.6,165 321,200 260.4,165 260.4,95" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<polygon points="260.5,165 321.1,200 321.1,270 260.5,305 199.9,270 199.9,200" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>

<circle cx="200" cy="130" r="17" fill="#FAF7F0" stroke="#3B6D11" stroke-width="1"/>
<text x="200" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2421">8</text>
<text x="200" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#27500A">bosque · madera</text>

<circle cx="321" cy="130" r="17" fill="#FAF7F0" stroke="#854F0B" stroke-width="1"/>
<text x="321" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2421">5</text>
<text x="321" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#633806">campos · trigo</text>

<circle cx="260.5" cy="235" r="17" fill="#FAF7F0" stroke="#5F5E5A" stroke-width="1"/>
<text x="260.5" y="241" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2421">9</text>
<text x="260.5" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444441">montañas · mineral</text>

<line x1="260.5" y1="165" x2="200" y2="200" stroke="#534AB7" stroke-width="5" stroke-linecap="round"/>
<circle cx="260.5" cy="165" r="8.5" fill="#D85A30" stroke="#FAF7F0" stroke-width="2.5"/>

<line x1="360" y1="85" x2="444" y2="66" stroke="#9AA39D" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="360" cy="85" r="2.5" fill="#59635C"/>
<text x="452" y="62" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2421">Hexágono</text>
<text x="452" y="82" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">Un terreno con su ficha. Hay 19.</text>

<line x1="269" y1="165" x2="444" y2="146" stroke="#9AA39D" stroke-width="1" stroke-dasharray="3 3"/>
<text x="452" y="142" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#993C1D">Vértice</text>
<text x="452" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">Esquina donde va un poblado.</text>
<text x="452" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">Hay 54.</text>

<line x1="228" y1="184" x2="444" y2="226" stroke="#9AA39D" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="228" cy="184" r="2.5" fill="#59635C"/>
<text x="452" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3C3489">Arista</text>
<text x="452" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">Lado donde va un camino.</text>
<text x="452" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">Hay 72.</text>

<rect x="130" y="300" width="380" height="54" rx="8" fill="#F4EFE4" stroke="#C99A2E" stroke-width="1"/>
<text x="320" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2421">Pips de ese vértice: 5 + 4 + 4 = 13</text>
<text x="320" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4A544D">Suma de los pips de los tres hexágonos que toca</text>
</svg>
