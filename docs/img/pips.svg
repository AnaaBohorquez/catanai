<svg xmlns="http://www.w3.org/2000/svg" width="680" height="215" viewBox="0 0 680 215" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pips de cada ficha numérica en Catan</title>
<desc>Cada número del 2 al 12 con su cantidad de pips. El 6 y el 8 tienen 5 pips, el máximo. El 2 y el 12 tienen 1.</desc>
<rect x="0" y="0" width="680" height="215" fill="#FAF7F0"/>

<circle cx="70" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="70" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">2</text>
<circle cx="70" cy="96" r="3" fill="#5F5E5A"/>
<text x="70" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">1 pip</text>

<circle cx="125" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="125" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">3</text>
<circle cx="121" cy="96" r="3" fill="#5F5E5A"/><circle cx="129" cy="96" r="3" fill="#5F5E5A"/>
<text x="125" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">2</text>

<circle cx="180" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="180" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">4</text>
<circle cx="172" cy="96" r="3" fill="#5F5E5A"/><circle cx="180" cy="96" r="3" fill="#5F5E5A"/><circle cx="188" cy="96" r="3" fill="#5F5E5A"/>
<text x="180" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">3</text>

<circle cx="235" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="235" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">5</text>
<circle cx="223" cy="96" r="3" fill="#5F5E5A"/><circle cx="231" cy="96" r="3" fill="#5F5E5A"/><circle cx="239" cy="96" r="3" fill="#5F5E5A"/><circle cx="247" cy="96" r="3" fill="#5F5E5A"/>
<text x="235" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">4</text>

<circle cx="290" cy="58" r="21" fill="#FAC775" stroke="#854F0B" stroke-width="1.6"/>
<text x="290" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#633806">6</text>
<circle cx="274" cy="96" r="3" fill="#854F0B"/><circle cx="282" cy="96" r="3" fill="#854F0B"/><circle cx="290" cy="96" r="3" fill="#854F0B"/><circle cx="298" cy="96" r="3" fill="#854F0B"/><circle cx="306" cy="96" r="3" fill="#854F0B"/>
<text x="290" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#854F0B">5</text>

<circle cx="345" cy="58" r="21" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="345" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#791F1F">7</text>
<text x="345" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#A32D2D">ladrón</text>
<text x="345" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#A32D2D">6</text>

<circle cx="400" cy="58" r="21" fill="#FAC775" stroke="#854F0B" stroke-width="1.6"/>
<text x="400" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#633806">8</text>
<circle cx="384" cy="96" r="3" fill="#854F0B"/><circle cx="392" cy="96" r="3" fill="#854F0B"/><circle cx="400" cy="96" r="3" fill="#854F0B"/><circle cx="408" cy="96" r="3" fill="#854F0B"/><circle cx="416" cy="96" r="3" fill="#854F0B"/>
<text x="400" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#854F0B">5</text>

<circle cx="455" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="455" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">9</text>
<circle cx="443" cy="96" r="3" fill="#5F5E5A"/><circle cx="451" cy="96" r="3" fill="#5F5E5A"/><circle cx="459" cy="96" r="3" fill="#5F5E5A"/><circle cx="467" cy="96" r="3" fill="#5F5E5A"/>
<text x="455" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">4</text>

<circle cx="510" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="510" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">10</text>
<circle cx="502" cy="96" r="3" fill="#5F5E5A"/><circle cx="510" cy="96" r="3" fill="#5F5E5A"/><circle cx="518" cy="96" r="3" fill="#5F5E5A"/>
<text x="510" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">3</text>

<circle cx="565" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="565" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">11</text>
<circle cx="561" cy="96" r="3" fill="#5F5E5A"/><circle cx="569" cy="96" r="3" fill="#5F5E5A"/>
<text x="565" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">2</text>

<circle cx="620" cy="58" r="21" fill="#E8E4DA" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="620" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2421">12</text>
<circle cx="620" cy="96" r="3" fill="#5F5E5A"/>
<text x="620" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#59635C">1</text>

<line x1="50" y1="152" x2="630" y2="152" stroke="#D8D2C4" stroke-width="1"/>
<text x="340" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A544D">Los puntitos debajo del número son los pips: en cuántas de las 36 tiradas de dos dados sale ese número.</text>
<text x="340" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A544D">El 6 y el 8 son los más productivos. El 2 y el 12 casi nunca salen. El 7 no va en el tablero: mueve al ladrón.</text>
</svg>
