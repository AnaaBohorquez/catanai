[project]
name = "colono-ia-backend"
version = "0.1.0"
description = "API de Colono IA: recomendador de colocación inicial en Catan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn==1.8.0",
    "joblib>=1.4",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]
llm = ["openai>=1.54"]
# Para abrir notebooks/ con este mismo entorno (y su scikit-learn 1.8.0) en Cursor o
# Jupyter. Render no lo instala: su build usa solo --extra llm.
notebooks = ["ipykernel>=6.29", "plotly>=5.24", "nbformat>=5.10"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
