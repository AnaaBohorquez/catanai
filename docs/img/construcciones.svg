<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Qué construye cada combinación de recursos en Catan</title>
<desc>Las cuatro construcciones con su costo. Madera con ladrillo da caminos y poblados; trigo con mineral da ciudades. Ladrillo con mineral no completa ninguna construcción.</desc>
<rect x="0" y="0" width="680" height="330" fill="#FAF7F0"/>

<rect x="40" y="30" width="135" height="176" rx="10" fill="#FFFFFF" stroke="#E5DED0" stroke-width="1"/>
<text x="107" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2421">Camino</text>
<rect x="52" y="68" width="111" height="24" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8"/>
<text x="107" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#173404">1 madera</text>
<rect x="52" y="98" width="111" height="24" rx="5" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/>
<text x="107" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4A1B0C">1 ladrillo</text>
<text x="107" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#59635C">Expansión y</text>
<text x="107" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#59635C">camino más largo</text>

<rect x="195" y="30" width="135" height="176" rx="10" fill="#FFFFFF" stroke="#E5DED0" stroke-width="1"/>
<text x="262" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2421">Poblado</text>
<rect x="207" y="68" width="111" height="24" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8"/>
<text x="262" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#173404">1 madera</text>
<rect x="207" y="98" width="111" height="24" rx="5" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/>
<text x="262" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4A1B0C">1 ladrillo</text>
<rect x="207" y="128" width="111" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
<text x="262" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#412402">1 trigo</text>
<rect x="207" y="158" width="111" height="24" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/>
<text x="262" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#27500A">1 oveja</text>
<text x="262" y="199" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#59635C">1 punto de victoria</text>

<rect x="350" y="30" width="135" height="176" rx="10" fill="#FFFFFF" stroke="#E5DED0" stroke-width="1"/>
<text x="417" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2421">Ciudad</text>
<rect x="362" y="68" width="111" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
<text x="417" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#412402">2 trigo</text>
<rect x="362" y="98" width="111" height="24" rx="5" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="417" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">3 mineral</text>
<text x="417" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#59635C">1 punto extra y</text>
<text x="417" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#59635C">producción doble</text>

<rect x="505" y="30" width="135" height="176" rx="10" fill="#FFFFFF" stroke="#E5DED0" stroke-width="1"/>
<text x="572" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2421">Carta de desarrollo</text>
<rect x="517" y="68" width="111" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
<text x="572" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#412402">1 trigo</text>
<rect x="517" y="98" width="111" height="24" rx="5" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/>
<text x="572" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#27500A">1 oveja</text>
<rect x="517" y="128" width="111" height="24" rx="5" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="572" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">1 mineral</text>
<text x="572" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#59635C">Caballeros, puntos</text>
<text x="572" y="199" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#59635C">y ejército mayor</text>

<rect x="40" y="228" width="290" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="185" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#173404">Parejas que sí completan algo</text>
<text x="185" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#27500A">madera + ladrillo → camino</text>
<text x="185" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#27500A">trigo + mineral → ciudad</text>

<rect x="350" y="228" width="290" height="76" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
<text x="495" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#501313">Pareja que no completa nada</text>
<text x="495" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#791F1F">ladrillo + mineral → nada</text>
<text x="495" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#791F1F">le falta madera para camino, trigo para ciudad</text>
</svg>
