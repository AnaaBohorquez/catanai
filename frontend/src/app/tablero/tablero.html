<svg
  [attr.viewBox]="viewBox()"
  class="mx-auto block h-auto max-h-[calc(100vh-10rem)] w-full"
  role="img"
  aria-label="Tablero de Catan"
>
  <rect
    [attr.x]="marco().x" [attr.y]="marco().y"
    [attr.width]="marco().ancho" [attr.height]="marco().alto"
    [attr.rx]="tam * 0.4" fill="#0369a1"
  />
  <!-- Puertos: dos muelles hacia sus vértices y una marca en el mar. -->
  @for (p of puertos(); track $index; let i = $index) {
    <g
      [class.cursor-pointer]="revision()"
      [attr.role]="revision() ? 'button' : null"
      [attr.tabindex]="revision() ? 0 : null"
      (click)="revision() && tocarPuerto.emit(i)"
      (keydown.enter)="revision() && tocarPuerto.emit(i)"
    >
      <title>{{ p.nombre }}</title>
      @for (m of p.muelles; track $index) {
        <line
          [attr.x1]="p.marca.x" [attr.y1]="p.marca.y"
          [attr.x2]="m.x" [attr.y2]="m.y"
          stroke="#f5e6c4" [attr.stroke-width]="tam * 0.08" stroke-linecap="round"
        />
      }
      <circle
        [attr.cx]="p.marca.x" [attr.cy]="p.marca.y" [attr.r]="tam * 0.36"
        [attr.fill]="p.color"
        [attr.stroke]="revision() && puertoSeleccionado() === i ? '#b5532b' : '#1f2937'"
        [attr.stroke-width]="tam * (revision() && puertoSeleccionado() === i ? 0.1 : 0.03)"
      />
      <text
        [attr.x]="p.marca.x" [attr.y]="p.recurso ? p.marca.y - tam * 0.08 : p.marca.y"
        text-anchor="middle" dominant-baseline="central"
        [attr.font-size]="tam * 0.22" font-weight="700" [attr.fill]="p.tinta"
      >{{ p.texto }}</text>
      @if (p.recurso) {
        <text
          [attr.x]="p.marca.x" [attr.y]="p.marca.y + tam * 0.14"
          text-anchor="middle" dominant-baseline="central"
          [attr.font-size]="tam * 0.13" font-weight="600" [attr.fill]="p.tinta"
        >{{ p.recurso }}</text>
      }
    </g>
  }

  <!-- Hexágonos: terreno, ficha con el número y los pips debajo. -->
  @for (h of hexagonos(); track h.id) {
    <g
      [class.cursor-pointer]="revision()"
      [attr.role]="revision() ? 'button' : null"
      [attr.tabindex]="revision() ? 0 : null"
      (click)="revision() && tocarHexagono.emit(h.id)"
      (keydown.enter)="revision() && tocarHexagono.emit(h.id)"
    >
      <title>{{ h.nombre }}</title>
      <polygon
        [attr.points]="h.esquinas" [attr.fill]="h.color"
        [attr.stroke]="h.seleccionado ? '#b5532b' : h.dudoso && revision() ? '#f59e0b' : '#f5e6c4'"
        [attr.stroke-width]="tam * (h.seleccionado ? 0.12 : h.dudoso && revision() ? 0.09 : 0.04)"
      />
      @if (revision() && h.dudoso) {
        <text [attr.x]="h.centro.x" [attr.y]="h.centro.y - tam * 0.62" text-anchor="middle"
              dominant-baseline="central" [attr.font-size]="tam * 0.3" font-weight="700" fill="#92400e">?</text>
      }
      @if (revision() && !h.numero && !h.desierto) {
        <circle [attr.cx]="h.centro.x" [attr.cy]="h.centro.y" [attr.r]="tam * 0.42"
                fill="#fdf6e3" stroke="#57534e" [attr.stroke-width]="tam * 0.02" stroke-dasharray="4 3" />
        <text [attr.x]="h.centro.x" [attr.y]="h.centro.y" text-anchor="middle" dominant-baseline="central"
              [attr.font-size]="tam * 0.36" fill="#78716c">–</text>
      }
      @if (h.numero) {
        <circle
          [attr.cx]="h.centro.x" [attr.cy]="h.centro.y" [attr.r]="tam * 0.42"
          fill="#fdf6e3" stroke="#57534e" [attr.stroke-width]="tam * 0.02"
        />
        <text
          [attr.x]="h.centro.x" [attr.y]="h.centro.y - tam * 0.05"
          text-anchor="middle" dominant-baseline="central"
          [attr.font-size]="tam * 0.36" font-weight="700"
          [attr.fill]="h.rojo ? '#b91c1c' : '#1c1917'"
        >{{ h.numero }}</text>
        @if (revision() && h.numeroDudoso) {
          <!-- Número leído con poco margen: aro ámbar y «?» para revisarlo. -->
          <circle [attr.cx]="h.centro.x" [attr.cy]="h.centro.y" [attr.r]="tam * 0.46"
                  fill="none" stroke="#f59e0b" [attr.stroke-width]="tam * 0.07" />
          <text [attr.x]="h.centro.x + tam * 0.42" [attr.y]="h.centro.y - tam * 0.36"
                text-anchor="middle" dominant-baseline="central"
                [attr.font-size]="tam * 0.26" font-weight="700" fill="#92400e">?</text>
        }
        @for (pip of h.pips; track $index) {
          <circle
            [attr.cx]="pip.x" [attr.cy]="pip.y" [attr.r]="tam * 0.035"
            [attr.fill]="h.rojo ? '#b91c1c' : '#1c1917'"
          />
        }
      }
      <!-- Velo crema: atenúa sin dejar ver el mar azul a través, como haría la opacidad. -->
      @if (h.atenuado) {
        <polygon [attr.points]="h.esquinas" fill="#fbf5e6" opacity="0.62" />
      }
    </g>
  }

  <!-- Marcas del usuario: su poblado (crema, «Tú») y los de rivales (gris oscuro). -->
  @for (m of marcados(); track m.id) {
    <g [attr.transform]="'translate(' + m.centro.x + ' ' + m.centro.y + ')'"
       [attr.aria-label]="m.tipo === 'propio' ? 'Tu poblado' : 'Poblado de un rival'">
      <path
        [attr.transform]="'scale(' + tam * 0.3 + ')'"
        d="M -1 -0.05 L 0 -1 L 1 -0.05 L 0.78 -0.05 L 0.78 0.85 L -0.78 0.85 L -0.78 -0.05 Z"
        [attr.fill]="m.tipo === 'propio' ? '#fbf5e6' : '#3f3f46'"
        [attr.stroke]="m.tipo === 'propio' ? '#3b2412' : '#f5f5f4'"
        stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"
      />
      @if (m.tipo === 'propio') {
        <text [attr.y]="tam * 0.12" text-anchor="middle" dominant-baseline="central"
              [attr.font-size]="tam * 0.2" font-weight="700" fill="#3b2412">Tú</text>
      }
    </g>
  }

  <!-- Las otras opciones: medallas pequeñas; tocarlas las selecciona. -->
  @for (p of otras(); track $index) {
    <g
      class="cursor-pointer"
      role="button"
      tabindex="0"
      [attr.pointer-events]="modo() ? 'none' : null"
      [attr.aria-label]="'Seleccionar la opción ' + (p.opcion + 1)"
      (click)="elegir.emit(p.opcion)"
      (keydown.enter)="elegir.emit(p.opcion)"
    >
      <circle
        [attr.cx]="p.centro.x" [attr.cy]="p.centro.y" [attr.r]="tam * 0.22"
        [attr.fill]="p.color" stroke="#3b2412" [attr.stroke-width]="tam * 0.04"
      />
      <text
        [attr.x]="p.centro.x" [attr.y]="p.centro.y"
        text-anchor="middle" dominant-baseline="central"
        [attr.font-size]="tam * 0.24" font-weight="700" fill="#ffffff"
      >{{ p.opcion + 1 }}</text>
    </g>
  }

  <!-- La opción seleccionada: dos casitas del color de su medalla. -->
  @for (p of poblados(); track $index) {
    <g [attr.transform]="'translate(' + p.centro.x + ' ' + p.centro.y + ')'" [attr.aria-label]="'Poblado de la opción ' + (p.opcion + 1)">
      <circle [attr.r]="tam * 0.42" fill="#ffffff" opacity="0.85" />
      <path
        [attr.transform]="'scale(' + tam * 0.3 + ')'"
        d="M -1 -0.05 L 0 -1 L 1 -0.05 L 0.78 -0.05 L 0.78 0.85 L -0.78 0.85 L -0.78 -0.05 Z"
        [attr.fill]="p.color" stroke="#3b2412" stroke-width="3" stroke-linejoin="round"
        vector-effect="non-scaling-stroke"
      />
      <text
        [attr.y]="tam * 0.1"
        text-anchor="middle" dominant-baseline="central"
        [attr.font-size]="tam * 0.24" font-weight="700" fill="#ffffff"
      >{{ p.opcion + 1 }}</text>
    </g>
  }

  <!-- Modo de marcado: cada vértice es tocable. El círculo invisible agranda el área
       de toque (unos 44 px en un celular); el punto o la ✖ indican su estado. -->
  @for (p of puntos(); track p.id) {
    <g
      class="cursor-pointer"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Vértice ' + (p.estado === 'bloqueado' ? 'bloqueado por la regla de distancia' : p.estado)"
      (click)="tocarVertice.emit(p.id)"
      (keydown.enter)="tocarVertice.emit(p.id)"
    >
      <circle [attr.cx]="p.centro.x" [attr.cy]="p.centro.y" [attr.r]="tam * 0.3" fill="transparent" />
      @if (p.estado === 'libre') {
        <circle [attr.cx]="p.centro.x" [attr.cy]="p.centro.y" [attr.r]="tam * 0.11"
                fill="#fbf5e6" stroke="#3b2412" [attr.stroke-width]="tam * 0.03" />
      } @else if (p.estado === 'bloqueado') {
        <text [attr.x]="p.centro.x" [attr.y]="p.centro.y" text-anchor="middle" dominant-baseline="central"
              [attr.font-size]="tam * 0.34" font-weight="700" fill="#3b2412" opacity="0.5">×</text>
      }
    </g>
  }

  <!-- Revisión: aristas de la costa a las que se puede mover el puerto seleccionado. -->
  @for (d of segmentosDestino(); track $index) {
    <g class="cursor-pointer" role="button" tabindex="0" aria-label="Mover el puerto aquí"
       (click)="tocarArista.emit(d.arista)" (keydown.enter)="tocarArista.emit(d.arista)">
      <line [attr.x1]="d.a.x" [attr.y1]="d.a.y" [attr.x2]="d.b.x" [attr.y2]="d.b.y"
            stroke="transparent" [attr.stroke-width]="tam * 0.4" />
      <line [attr.x1]="d.a.x" [attr.y1]="d.a.y" [attr.x2]="d.b.x" [attr.y2]="d.b.y"
            stroke="#b5532b" [attr.stroke-width]="tam * 0.1" stroke-dasharray="6 4" stroke-linecap="round" />
    </g>
  }
  <!-- Hacia dónde crecer: encima de todo y sin capturar toques, para que las
       letras se vean también en modo de marcado. -->
  @for (c of caminosDeCrecimiento(); track c.letra; let primero = $first) {
    <g pointer-events="none" [attr.aria-label]="'Destino ' + c.letra + ': ' + c.descripcion">
      <polyline
        [attr.points]="c.ruta" fill="none"
        [attr.stroke]="primero ? '#b5532b' : '#3b2412'" [attr.opacity]="primero ? 1 : 0.6"
        [attr.stroke-width]="tam * 0.1" stroke-dasharray="8 6"
        stroke-linecap="round" stroke-linejoin="round"
      />
      <circle
        [attr.cx]="c.centro.x" [attr.cy]="c.centro.y" [attr.r]="tam * 0.26"
        [attr.fill]="primero ? '#b5532b' : '#fbf5e6'" stroke="#3b2412" [attr.stroke-width]="tam * 0.04"
      />
      <text
        [attr.x]="c.centro.x" [attr.y]="c.centro.y" text-anchor="middle" dominant-baseline="central"
        [attr.font-size]="tam * 0.28" font-weight="700" [attr.fill]="primero ? '#ffffff' : '#3b2412'"
      >{{ c.letra }}</text>
    </g>
  }

</svg>
