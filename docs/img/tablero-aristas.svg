<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img"><title>Aristas como vértices que comparten dos hexágonos</title><desc>Vértices A y B comparten los hexágonos 0,-1 y 0,0 y forman una arista; el vértice C solo comparte un hexágono con A.</desc><style>
.th{font:500 14px sans-serif;fill:#2C2C2A}.ts{font:400 12px sans-serif;fill:#5F5E5A}
.leader{stroke:#888780;stroke-width:.5;stroke-dasharray:3 3;fill:none}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style><rect width="680" height="340" fill="#FFFFFF"/><polygon points="269.8,167.0 269.8,213.0 230.0,236.0 190.2,213.0 190.2,167.0 230.0,144.0" fill="#1D9E75" fill-opacity="0.35" stroke="#0F6E56" stroke-width="1"/><polygon points="349.5,167.0 349.5,213.0 309.7,236.0 269.8,213.0 269.8,167.0 309.7,144.0" fill="none" style="stroke:#B4B2A9" stroke-width="0.5"/><polygon points="309.7,98.0 309.7,144.0 269.8,167.0 230.0,144.0 230.0,98.0 269.8,75.0" fill="none" style="stroke:#B4B2A9" stroke-width="0.5"/><polygon points="230.0,98.0 230.0,144.0 190.2,167.0 150.3,144.0 150.3,98.0 190.2,75.0" fill="#1D9E75" fill-opacity="0.35" stroke="#0F6E56" stroke-width="1"/><polygon points="190.2,167.0 190.2,213.0 150.3,236.0 110.5,213.0 110.5,167.0 150.3,144.0" fill="none" style="stroke:#B4B2A9" stroke-width="0.5"/><polygon points="230.0,236.0 230.0,282.0 190.2,305.0 150.3,282.0 150.3,236.0 190.2,213.0" fill="none" style="stroke:#B4B2A9" stroke-width="0.5"/><polygon points="309.7,236.0 309.7,282.0 269.8,305.0 230.0,282.0 230.0,236.0 269.8,213.0" fill="none" style="stroke:#B4B2A9" stroke-width="0.5"/><text class="ts" x="230.0" y="190.0" text-anchor="middle" dominant-baseline="central">0,0</text><text class="ts" x="309.7" y="190.0" text-anchor="middle" dominant-baseline="central">1,0</text><text class="ts" x="269.8" y="121.0" text-anchor="middle" dominant-baseline="central">1,−1</text><text class="ts" x="190.2" y="121.0" text-anchor="middle" dominant-baseline="central">0,−1</text><text class="ts" x="150.3" y="190.0" text-anchor="middle" dominant-baseline="central">−1,0</text><text class="ts" x="190.2" y="259.0" text-anchor="middle" dominant-baseline="central">−1,1</text><text class="ts" x="269.8" y="259.0" text-anchor="middle" dominant-baseline="central">0,1</text><line x1="190.2" y1="167.0" x2="230.0" y2="144.0" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/><circle cx="190.2" cy="167.0" r="7" fill="#D85A30" stroke="#712B13" stroke-width="1"/><circle cx="230.0" cy="144.0" r="7" fill="#D85A30" stroke="#712B13" stroke-width="1"/><circle cx="269.8" cy="213.0" r="7" fill="#888780" stroke="#444441" stroke-width="1"/><text class="th" x="182" y="182" text-anchor="end" dominant-baseline="central">A</text><text class="th" x="242" y="136" text-anchor="start" dominant-baseline="central">B</text><text class="th" x="283.8" y="217.0" dominant-baseline="central">C</text><text class="th" x="440" y="70">A = {(−1,0), (0,−1), (0,0)}</text><text class="th" x="440" y="95">B = {(0,−1), (0,0), (1,−1)}</text><text class="ts" x="440" y="120">A ∩ B = {(0,−1), (0,0)}</text><text class="ts" x="440" y="140">Comparten 2 hexágonos: arista</text><text class="th" x="440" y="190">C = {(0,0), (0,1), (1,0)}</text><text class="ts" x="440" y="215">A ∩ C = {(0,0)}</text><text class="ts" x="440" y="235">Comparten 1: no hay arista</text><text class="ts" x="440" y="285">La arista es el lado que separa</text><text class="ts" x="440" y="305">los dos hexágonos compartidos</text></svg>