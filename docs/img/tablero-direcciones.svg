<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>Direcciones axiales</title><desc>Hexágono central 0,0 rodeado por sus seis vecinos; cada vecino muestra su coordenada y la dirección que se suma para llegar a él.</desc><style>
.th{font:500 14px sans-serif;fill:#2C2C2A}.ts{font:400 12px sans-serif;fill:#5F5E5A}
.leader{stroke:#888780;stroke-width:.5;stroke-dasharray:3 3;fill:none}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style><rect width="680" height="330" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><polygon points="349.5,167.0 349.5,213.0 309.7,236.0 269.8,213.0 269.8,167.0 309.7,144.0" fill="#7F77DD" fill-opacity="0.35" stroke="#534AB7" stroke-width="1"/><polygon points="309.7,98.0 309.7,144.0 269.8,167.0 230.0,144.0 230.0,98.0 269.8,75.0" fill="#7F77DD" fill-opacity="0.35" stroke="#534AB7" stroke-width="1"/><polygon points="230.0,98.0 230.0,144.0 190.2,167.0 150.3,144.0 150.3,98.0 190.2,75.0" fill="#7F77DD" fill-opacity="0.35" stroke="#534AB7" stroke-width="1"/><polygon points="190.2,167.0 190.2,213.0 150.3,236.0 110.5,213.0 110.5,167.0 150.3,144.0" fill="#7F77DD" fill-opacity="0.35" stroke="#534AB7" stroke-width="1"/><polygon points="230.0,236.0 230.0,282.0 190.2,305.0 150.3,282.0 150.3,236.0 190.2,213.0" fill="#7F77DD" fill-opacity="0.35" stroke="#534AB7" stroke-width="1"/><polygon points="309.7,236.0 309.7,282.0 269.8,305.0 230.0,282.0 230.0,236.0 269.8,213.0" fill="#7F77DD" fill-opacity="0.35" stroke="#534AB7" stroke-width="1"/><polygon points="269.8,167.0 269.8,213.0 230.0,236.0 190.2,213.0 190.2,167.0 230.0,144.0" fill="#EF9F27" fill-opacity="0.35" stroke="#BA7517" stroke-width="1"/><text class="th" x="230.0" y="190.0" text-anchor="middle" dominant-baseline="central">0,0</text><text class="th" x="309.7" y="180.0" text-anchor="middle" dominant-baseline="central">1,0</text><text class="ts" x="309.7" y="200.0" text-anchor="middle" dominant-baseline="central">(+1, 0)</text><text class="th" x="269.8" y="111.0" text-anchor="middle" dominant-baseline="central">1,−1</text><text class="ts" x="269.8" y="131.0" text-anchor="middle" dominant-baseline="central">(+1, −1)</text><text class="th" x="190.2" y="111.0" text-anchor="middle" dominant-baseline="central">0,−1</text><text class="ts" x="190.2" y="131.0" text-anchor="middle" dominant-baseline="central">(0, −1)</text><text class="th" x="150.3" y="180.0" text-anchor="middle" dominant-baseline="central">−1,0</text><text class="ts" x="150.3" y="200.0" text-anchor="middle" dominant-baseline="central">(−1, 0)</text><text class="th" x="190.2" y="249.0" text-anchor="middle" dominant-baseline="central">−1,1</text><text class="ts" x="190.2" y="269.0" text-anchor="middle" dominant-baseline="central">(−1, +1)</text><text class="th" x="269.8" y="249.0" text-anchor="middle" dominant-baseline="central">0,1</text><text class="ts" x="269.8" y="269.0" text-anchor="middle" dominant-baseline="central">(0, +1)</text><text class="ts" x="40" y="121.0" dominant-baseline="central">r = −1</text><text class="ts" x="40" y="190.0" dominant-baseline="central">r = 0</text><text class="ts" x="40" y="259.0" dominant-baseline="central">r = 1</text><text class="th" x="440" y="100">r = número de fila</text><text class="ts" x="440" y="120">−1 arriba, 0 en medio, +1 abajo</text><text class="th" x="440" y="160">q = posición en la fila</text><text class="ts" x="440" y="180">Crece hacia la derecha</text><text class="th" x="440" y="220">Dirección = paso a un vecino</text><text class="ts" x="440" y="240">Vecino = coordenada + dirección</text><text class="ts" x="440" y="260">Ej.: (0,0) + (+1, −1) = (1,−1)</text></svg>